<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="if_style.css">
    <title>If condition</title>
</head>
<body>
    <h1>If you are under 18 no car license</h1>
    <section class="if">
        <div class="first-line">age=18</div>
        <div class="second-line">
            <div class="p1" id="p1"></div>
            <div class="p1" id="p2"></div>
            <div class="p1" id="p3"></div>
            <div class="p1" id="p4"></div>
            <div class="p1" id="p5"></div>
        </div>
        <div class="third-line"></div>
    </section>
    <section class="options">
        <div class="op wrong" id="">even</div>
        <div class="op wrong" id="">=</div>
        <div class="op correct" id="correct5">:</div>
        <div class="op correct" id="correct2">age</div>
        <div class="op wrong" id="">19</div>
        <div class="op correct" id="correct1">if</div>
        <div class="op correct" id="correct6">print("no driver liscense for you")</div>
        <div class="op wrong" id=""><=</div>
        <div class="op correct" id="correct3"><</div>
        <div class="op wrong" id="">number</div>
        <div class="op wrong" id="">print("You can have driver license")</div>
        <div class="op wrong" id="">;</div>
        <div class="op correct" id="correct4">18</div>
    </section>
    <div id="next-level">Next Level</div>
    <script src="if_main.js"></script>
</body>
</html>
