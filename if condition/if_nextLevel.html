<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="if_style.css">
    <title>If condition</title>
</head>
<body>
    <h1>If the weather is cold wear jacket</h1>
    <section class="if">
        <div class="first-line">weather="cold"</div>
        <div class="second-line">
            <div class="p1" id="p21"></div>
            <div class="p1" id="p22"></div>
            <div class="p1" id="p23"></div>
            <div class="p1" id="p24"></div>
            <div class="p1" id="p25"></div>
        </div>
        <div class="third-line"></div>
    </section>
    <section class="options">
        <div class="op wrong" id="">even</div>
        <div class="op wrong" id=""><</div>
        <div class="op correct" id="correct25">:</div>
        <div class="op correct" id="correct24">"cold"</div>
        <div class="op wrong" id="">"hot"</div>
        <div class="op correct" id="correct21">if</div>
        <div class="op correct" id="correct26">print("Wear a jacket")</div>
        <div class="op wrong" id="">11</div>
        <div class="op correct" id="correct23">==</div>
        <div class="op wrong" id="">number</div>
        <div class="op wrong" id="">print("wear a T-shirt")</div>
        <div class="op wrong" id="">;</div>
        <div class="op correct" id="correct22">weather</div>
    </section>
    <script src="if_main2.js"></script>
</body>
</html>
